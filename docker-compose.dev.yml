version: '3.8'

services:
  pikalink-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: pikalink-dev
    ports:
      - "8080:8080"
      - "3000:3000"  # Frontend dev server
    volumes:
      - .:/app
      - pikalink_dev_data:/app/data
      - /app/frontend/node_modules
      - /app/backend/vendor
    environment:
      - DB_PATH=/app/data/pikalink.db
      - GIN_MODE=debug
    restart: unless-stopped

volumes:
  pikalink_dev_data:
    driver: local