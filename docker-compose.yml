version: '3.8'

services:
  pikalink:
    image: bytetopia/pikalink:latest
    ports:
      - "8080:8080"
    volumes:
      - pikalink_data:/app/data
    environment:
      - DATA_PATH=/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/admin/"]
      interval: 1800s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pikalink_data: