version: '3.8'

services:
  pikalink:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pikalink-app
    ports:
      - "8080:8080"
    volumes:
      - pikalink_data:/app/data
    environment:
      - DB_PATH=/app/data/pikalink.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/admin"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Reverse proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: pikalink-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - pikalink
    restart: unless-stopped

volumes:
  pikalink_data:
    driver: local